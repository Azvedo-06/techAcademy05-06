services:
  database:
    image: mysql:8.0
    container_name: mysql-container
    env_file:
      - ./.env
    ports:
      - "3003:3306"
    volumes:
      - ./data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: frontend
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    networks:
      - app_network

  nginx:
    build: ./nginx
    container_name: nginx
    depends_on:
      - frontend
      - backend
    ports:
      - 80:80
      - 443:443
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge